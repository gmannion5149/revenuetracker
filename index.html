/* ── core/clioemail.js ── */
'use strict';
/* ═════════════════ CLIO PAYMENT EMAILS ═════════════════
   Reads the notification emails Clio Payments sends to the whole firm and turns each into
   a payment event. The same code runs in the browser (pasted emails) and in the firm worker
   (Gmail scan), so both read an email identically.

   Formats handled (as Clio sends them in 2026):
     "Payment submitted from NAME"                         one-time payment, Confirmation #
     "[Action Required] Payment from NAME is now available" same payment, now settled
     "Payment plan installment submitted for NAME"         installment, Confirmation #
     "[Attention] Payment from NAME failed"                one-time failure
     "[Attention] Payment plan installment for NAME failed"
     "Refund submitted for NAME"
   Anything else from Clio (tasks, leads, surplus notices, processing fees) returns null.
   Kept out on purpose: payer email, card digits, routing and account numbers. */
const CLIO_TZ_OFFSETS = {UTC:0, GMT:0, EST:-5, EDT:-4, CST:-6, CDT:-5, MST:-7, MDT:-6, PST:-8, PDT:-7, AKST:-9, AKDT:-8, HST:-10};
const CLIO_MONTHS = {jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11};

function clioTidyName(s){
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if(s && s === s.toUpperCase() && /[A-Z]/.test(s)) s = s.toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase());
  return s;
}
function clioCents(s){
  const m = String(s || '').match(/\$\s*(-?[\d,]+(?:\.\d{1,2})?)/); if(!m) return null;
  const [w, f] = m[1].replace(/,/g, '').split('.');
  return Math.abs(+w) * 100 + (f ? +(f + '0').slice(0, 2) : 0);
}
/** "Oct 02, 2026 11:53am MDT" / "Fri Oct 02, 2026 11:07AM MDT" → instant (ISO) */
function clioWhen(s){
  const m = String(s || '').match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),\s*(\d{4})(?:\s+(\d{1,2}):(\d{2})\s*([ap]m)?)?\s*([A-Z]{2,4})?/i);
  if(!m) return null;
  const mo = CLIO_MONTHS[m[1].toLowerCase()]; if(mo == null) return null;
  let h = m[4] ? +m[4] : 12; const mi = m[5] ? +m[5] : 0, ap = (m[6] || '').toLowerCase();
  if(ap === 'pm' && h < 12) h += 12; if(ap === 'am' && h === 12) h = 0;
  const off = CLIO_TZ_OFFSETS[(m[7] || '').toUpperCase()]; const o = off == null ? -6 : off;
  return new Date(Date.UTC(+m[3], mo, +m[2], h - o, mi)).toISOString();
}
/** calendar date in America/Chicago for an instant */
function clioChicagoDate(iso){
  try{ return new Intl.DateTimeFormat('en-CA', {timeZone:'America/Chicago', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(iso)) }
  catch(e){ return String(iso).slice(0, 10) }
}
function clioField(body, label){
  const re = new RegExp('^\\s*' + label + '\\s*[:#]*\\s*(.+)$', 'im'); const m = String(body).match(re);
  return m ? m[1].trim() : '';
}
function clioMethod(body){
  const card = String(body).match(/^\s*(?:Method[:\s]+)?(Visa|Mastercard|MasterCard|American Express|Amex|Discover)\b[^\n]*/im);
  if(card) return 'Card';
  if(/eCheck|\bACH\b|bank account/i.test(body)) return 'eCheck';
  return '';
}

/** @param {{id?:string, subject:string, body:string, received?:string}} m */
function parseClioPaymentEmail(m){
  const subject = String(m.subject || '').replace(/\s+/g, ' ').trim(), body = String(m.body || '').replace(/\r/g, '');
  let kind = null, who = '';
  let x;
  if((x = subject.match(/^Payment submitted from (.+)$/i))){ kind = 'submitted'; who = x[1] }
  else if((x = subject.match(/Payment from (.+?) is now available/i))){ kind = 'available'; who = x[1] }
  else if((x = subject.match(/^Payment plan installment submitted for (.+)$/i))){ kind = 'installment'; who = x[1] }
  else if((x = subject.match(/Payment plan installment for (.+?) failed/i))){ kind = 'failed'; who = x[1] }
  else if((x = subject.match(/Payment from (.+?) failed/i))){ kind = 'failed'; who = x[1] }
  else if((x = subject.match(/^Refund submitted for (.+)$/i))){ kind = 'refund'; who = x[1] }
  if(!kind) return null;

  const conf = ((body.match(/Confirmation\s*#\s*:?\s*([A-Z0-9]{5,})/i) || subject.match(/Confirmation\s*#\s*([A-Z0-9]{5,})/i) || [])[1] || '').toUpperCase();
  const amtLine = kind === 'refund' ? body.match(/Total payment refunded[:\s]*(\$[\d,]+(?:\.\d{2})?)/i)
    : kind === 'failed' ? body.match(/Total failed payment[:\s]*(\$[\d,]+(?:\.\d{2})?)/i)
    : body.match(/Total payment[:\s]*(\$[\d,]+(?:\.\d{2})?)/i);
  const amount = amtLine ? clioCents(amtLine[1]) : null;
  if(amount == null) return null;

  const name = clioTidyName(clioField(body, 'Name') || who);
  const desc = clioField(body, 'Description');
  const acct = /trust/i.test(clioField(body, 'Deposit account type')) ? 'trust' : 'operating';
  const whenTxt = clioField(body, 'Date');
  const paidAt = clioWhen(whenTxt) || m.received || null;
  /* a refund email repeats the original payment's date; the refund itself happened when the email went out */
  const at = kind === 'refund' ? (m.received || paidAt) : paidAt;
  const bal = clioField(body, 'Balance after payment'), balBefore = clioField(body, 'Balance before payment');
  const err = (body.match(/^\s*Error:\s*(.+)$/im) || [])[1] || '';
  const forWhom = (desc.match(/(?:payment|retainer|fees?|representation)\s+(?:fee\s+)?for\s+(.+)$/i) || [])[1] || '';
  return {
    key: conf || ('msg:' + (m.id || '')), conf, msgId: m.id || '', kind,
    payer: name, desc, forWhom: clioTidyName(forWhom.replace(/\blegal fees?$/i, '')),
    amount, account: acct, method: clioMethod(body),
    at, date: at ? clioChicagoDate(at) : null,
    balanceAfter: bal ? clioCents(bal) : null, balanceBefore: balBefore ? clioCents(balBefore) : null,
    error: err.replace(/&#39;/g, "'").trim(), received: m.received || null
  };
}

/** Folds events into one record per payment: submitted + available share a confirmation number.
    status: 'cleared' once submitted or settled, 'failed' when Clio reports the attempt failed,
    'refund' for refunds. Installments only ever send "submitted" or "failed". */
function foldClioEvents(events){
  const by = {};
  for(const e of events){
    if(!e) continue;
    const g = by[e.key] || (by[e.key] = {key:e.key, conf:e.conf, kinds:[], msgIds:[], payer:e.payer, desc:e.desc, forWhom:e.forWhom, amount:e.amount, account:e.account, method:e.method, date:e.date, at:e.at, balanceAfter:e.balanceAfter, error:''});
    if(!g.kinds.includes(e.kind)) g.kinds.push(e.kind);
    if(e.msgId && !g.msgIds.includes(e.msgId)) g.msgIds.push(e.msgId);
    for(const k of ['payer','desc','forWhom','method']) if(!g[k] && e[k]) g[k] = e[k];
    if(e.kind !== 'failed' && e.kind !== 'available' && e.date){ g.date = e.date; g.at = e.at }
    if(e.kind === 'failed' && e.date) g.failedOn = e.date;
    if(e.balanceAfter != null) g.balanceAfter = e.balanceAfter;
    if(e.error) g.error = e.error;
  }
  return Object.values(by).map(g => {
    g.status = g.kinds.includes('refund') ? 'refund' : g.kinds.includes('failed') ? 'failed' : 'cleared';
    g.settled = g.kinds.includes('available');
    g.installment = g.kinds.includes('installment') || /installment/.test(g.kinds.join());
    return g;
  }).sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
}

/* ── core/payinbox.js ── */
'use strict';
/* ═════════════════ PAYMENT INBOX ═════════════════
   Clio payment emails become inbox items. Nothing is recorded until you approve:
     • Yes → pick the client → Approve: the payment is recorded with the email's date and amount.
     • No  → the item is discarded and never asked about again (on any device).
   Once a payment is linked, later emails about it apply on their own: a failure notice
   marks it failed, and a settlement notice is noted. A linked payment carries the email key
   (emailKey) and Clio's confirmation number (ref), so nothing is ever recorded twice.

   Where events come from:
     • the firm worker (/gwm/payments), which reads Gmail on a 5-minute schedule
     • emails pasted into the inbox by hand
   Events live in this device's storage; decisions live in the synced data. */
let PAY_EVENTS = {};                /* key → event, newest copy wins */
const PayState = {lastCheck:null, lastError:null, phase:'idle', source:null};
const PAY_EVENT_CAP = 600;

function payCfg(){
  const s = DB.settings; if(!s.payInbox) s.payInbox = {};
  const c = s.payInbox; if(!c.dismissed) c.dismissed = {}; if(!c.since) c.since = addDays(todayISO(), -60); if(c.on == null) c.on = true; if(!c.days) c.days = 60;
  return c;
}
async function loadPayEvents(){ try{ const v = await Store.get('payevents'); PAY_EVENTS = v ? JSON.parse(v) : {} }catch(e){ PAY_EVENTS = {} } }
function savePayEvents(){
  const keys = Object.keys(PAY_EVENTS); if(keys.length > PAY_EVENT_CAP){ keys.sort((a,b)=>String(PAY_EVENTS[a].at||'').localeCompare(String(PAY_EVENTS[b].at||''))).slice(0, keys.length - PAY_EVENT_CAP).forEach(k => delete PAY_EVENTS[k]) }
  Store.set('payevents', JSON.stringify(PAY_EVENTS)).catch(()=>{});
}
/** add parsed events; returns the number that were new */
function ingestPayEvents(list){
  let n = 0;
  for(const e of list || []){ if(!e || !e.key || e.amount == null) continue; const id = e.key+'|'+e.kind+'|'+(e.msgId||''); if(!PAY_EVENTS[id]) n++; PAY_EVENTS[id] = e }
  if(n) savePayEvents();
  return n;
}
function payGroups(){ return foldClioEvents(Object.values(PAY_EVENTS)) }

/** the payment already recorded for an email group, if any */
function linkedPayment(g){
  for(const c of DB.cases) for(const p of (c.payments||[])){
    if(p.emailKey && p.emailKey === g.key) return {c, p};
    if(g.conf && p.ref && String(p.ref).toUpperCase() === g.conf && payType(p) === (g.status === 'refund' ? 'refund' : 'payment')) return {c, p};
  }
  return null;
}
function inboxItems(){
  const cfg = payCfg();
  return payGroups().filter(g => g.date && g.date >= cfg.since && !cfg.dismissed[g.key] && !linkedPayment(g));
}
/** Clio emails go to the whole firm. A payment is "likely yours" when the payer or the
    description names one of your clients, or the description names you. Only those pop up;
    the rest wait quietly in the inbox under "Other firm payments". */
function payLikelyMine(g){ return payMatches(g, 1).length > 0 || /\b(gerard|mannion)\b/i.test(g.desc || '') }
/** files of an agreement that still carry an undated lump-sum "collected" figure from the old tracker */
function lumpFileFor(c, amt){ return [c, ...DB.cases.filter(x => x !== c && x.sub && x.sharedFee && agreementOf(x) === c)].find(f => C(f.legacyCollected) >= amt) || null }

function restorePayItem(key){ const cfg = payCfg(); delete cfg.dismissed[key]; markS('payInbox'); save() }

/** Apply later news to payments already linked. Returns a list of what changed. */
function applyPayUpdates(){
  const out = [];
  for(const g of payGroups()){
    const L = linkedPayment(g); if(!L) continue;
    const {c, p} = L, st = p.status || 'cleared';
    if(g.status === 'failed' && st !== 'failed' && payType(p) === 'payment'){ setPaymentStatus(c, p, 'failed', g.failedOn || g.date || todayISO()); out.push({c, p, what:'failed'}) }
    else if(g.settled && !p.settledAt){ p.settledAt = g.date || todayISO(); p.upd = nowISO(); touch(c); out.push({c, p, what:'settled'}) }
  }
  if(out.length) save();
  return out;
}

/** Record an approved inbox item against a fee agreement. */
function approvePayItem(g, c, o){
  o = o || {};
  const amt = o.amt != null ? o.amt : g.amount, date = o.date || g.date || todayISO();
  const note = ['Clio'+(g.installment ? ' installment' : ''), g.desc].filter(Boolean).join(' · ');
  let p;
  if(o.fromLump && g.status !== 'refund' && g.status !== 'failed'){
    const lf = lumpFileFor(c, amt);
    if(lf){ lf.legacyCollected = D(C(lf.legacyCollected) - amt); hist(lf, 'Moved '+moneyc(amt)+' out of the undated lump sum to its real date ('+usDate(date)+') from a Clio email'); touch(lf) }
  }
  if(g.status === 'refund') p = addRefund(c, {amt, date, method:o.method || g.method, account:o.account || g.account, ref:g.conf || '', note});
  else p = addPayment(c, {amt, date, status:g.status === 'failed' ? 'failed' : 'cleared', method:o.method || g.method || 'Card', account:o.account || g.account, source:'clio-email', ref:g.conf || '', note}, true);
  p.emailKey = g.key; p.source = 'clio-email'; if(g.settled) p.settledAt = g.date;
  if(g.status === 'failed'){ p.statusDate = g.failedOn || g.date }
  p.upd = nowISO(); touch(c); save();
  return p;
}

/** Best guesses for which client a payment belongs to, strongest first. */
function payMatches(g, limit){
  const words = s => String(s||'').toLowerCase().replace(/[^a-z\s'-]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !/^(payment|for|fee|fees|retainer|legal|the|and|of|plan|installment|representation|case|balance)$/.test(w));
  const hay = new Set([...words(g.payer), ...words(g.forWhom), ...words(g.desc)]);
  const scored = [];
  for(const c of billables()){
    const L = leadOf(c), last = String(L.last||'').toLowerCase(), first = String(L.first||'').toLowerCase();
    let s = 0;
    if(last && last.split(/[\s-]+/).some(w => hay.has(w))) s += 3;
    if(first && first.split(/[\s-]+/).some(w => hay.has(w))) s += 1;
    if(s) scored.push({c, s: s + (c.resolved ? 0 : .5) + (owedOf(c) > 0 ? .5 : 0)});
  }
  return scored.sort((a,b) => b.s - a.s || displayName(leadOf(a.c)).localeCompare(displayName(leadOf(b.c)))).slice(0, limit || 6).map(x => x.c);
}

/** A payment already on the books that is probably this one: same client (as matched by name),
    same amount, within a week, not already tied to a different email. */
function similarRecorded(g, c){
  if(g.status === 'refund' || g.status === 'failed') return null;
  const files = [c, ...DB.cases.filter(x => x !== c && x.sub && x.sharedFee && agreementOf(x) === c)];
  let best = null;
  for(const f of files) for(const p of (f.payments||[])){
    if(payType(p) !== 'payment' || (p.emailKey && p.emailKey !== g.key)) continue;
    if(Math.abs(C(p.amount)) !== g.amount || !p.date || !g.date) continue;
    const gap = Math.abs(daysBetween(p.date, g.date)); if(gap > 7) continue;
    if(!best || gap < best.gap) best = {c, f, p, gap};
  }
  return best;
}
function likelyRecorded(g){ for(const c of payMatches(g, 4)){ const s = similarRecorded(g, c); if(s) return s } return null }
/** Tie an email to the payment already recorded for it. Money is unchanged. */
function linkExistingPay(g, f, p){
  p.emailKey = g.key; if(!p.ref && g.conf) p.ref = g.conf; if(!p.method && g.method) p.method = g.method; if(g.settled) p.settledAt = g.date;
  p.upd = nowISO(); hist(f, 'Matched to Clio payment email'+(g.conf ? ' (confirmation '+g.conf+')' : '')); touch(f); save();
}

/* ── fetching from the firm worker ── */
async function payFetch(path){
  const url = clioRelay() + path;
  let r; try{ r = await fetch(url, {headers:{'Accept':'application/json'}, cache:'no-store'}) }
  catch(e){ throw new Error('Could not reach the firm worker') }
  let j = null; try{ j = await r.json() }catch(e){}
  if(r.status === 404) throw Object.assign(new Error('The firm worker does not have the Gmail payment reader yet'), {code:'missing'});
  if(j && j.reauthorize === 'google') throw Object.assign(new Error('Google needs to be reconnected to allow reading Clio payment emails'), {code:'google'});
  if(!r.ok) throw new Error((j && (j.error || j.message)) || ('Firm worker returned '+r.status));
  return j || {};
}
async function checkPayEmails(manual){
  if(DEMO || PayState.phase === 'busy') return 0;
  const cfg = payCfg(); if(!cfg.on && !manual) return 0;
  PayState.phase = 'busy';
  try{
    const j = await payFetch('/gwm/payments?days='+(cfg.days || 45));
    const n = ingestPayEvents(j.events || []);
    PayState.lastCheck = nowISO(); PayState.lastError = null; PayState.source = j.scannedAt || null; PayState.phase = 'idle';
    return n;
  }catch(e){ PayState.lastError = e.message; PayState.code = e.code || null; PayState.phase = 'idle'; if(manual) throw e; return 0 }
}

    for(const i of items){

      if(kind === 'writeoff') for(const c of i.r.ag){ const b = owedOf(c); if(b > 0) addAdjustment(c, {kind:'writeoff', amt:-b, date:today, note:val('bk-note') || "Client can't pay"}, true); if(c.plan && c.plan.active){ c.plan.active = false; c.plan.endedOn = today; hist(c, 'Payment plan stopped (balance written off)') } }

    }
    save(); closeModal(); CF.sel = new Set(); refresh(); toast(title+' · done');
  };
}

function statementMatch(text, name){

  for(const r of rows.slice(1)){
    const d = parseDateLoose(r[di]), a = parseMoney(String(r[ai]||'').replace(/[()]/g,'')); if(!d || !a || a <= 0){ continue }

function handleBackupFile(file){

      const M = smartMerge(DB, {...d, meta:{...(d.meta||{}), savedAt:'2000-01-01T00:00:00.000Z'}}, null); DB = M; normalizeDB(); migrateDB().then(()=>{ settleAfterLoad(); save(); refresh(); toast('Backup merged in') }) }, 'Merge');

'use strict';
/* ═════════════════ ASK MY NUMBERS ═════════════════
   Deterministic: each question is matched to a fixed calculation over your records and
   answered with the figures and links to the records behind them. No AI model is involved,
   nothing is estimated from prose, and nothing is changed. Questions it does not recognize
   get a list of the ones it can answer. */
const ASK = [
  {q:'Which cases account for most of my outstanding balance?', re:/(most|largest|biggest|top).*(outstanding|balance|owe)|(outstanding|balance).*(most|concentrat)/i, run:askBalances},
  {q:'How much earned commission have I not received?', re:/(not|un|haven'?t).*(receiv|paid)|commission.*(owed|outstanding)/i, run:askUnreceived},
  {q:'Which client sources produce the strongest collections?', re:/source|referral.*(collect|best|strong)|where.*clients/i, run:askSources},
  {q:'Who is behind on a payment plan?', re:/behind|past.?due|overdue|late/i, run:askPastDue},
  {q:'How much have I collected this month?', re:/collect.*(this|month|week|quarter|year)|how much.*collect/i, run:askCollected},
  {q:'What closing commission is waiting on open cases?', re:/closing|at close|banked|waiting/i, run:askClosing},
  {q:'Where does my quarterly bonus stand?', re:/bonus|tier|threshold/i, run:askBonus}
];
function openAsk(){
  openModal({title:'Ask my numbers', sub:'Answers come from fixed calculations on your records, not from AI', wide:true, foot:'',
    body:'<div style="display:flex;gap:8px"><input class="fi" id="ask-in" placeholder="Ask about balances, commission, collections…" aria-label="Question"><button class="btn prim" id="ask-go">Ask</button></div><div class="bar" style="margin-top:10px;gap:6px">'+ASK.map((a,i) => '<button class="pill" data-ask="'+i+'">'+esc(a.q)+'</button>').join('')+'</div><div id="ask-out" aria-live="polite"></div>'});
  const go = q => { const a = ASK.find(x => x.re.test(q)); $('#ask-out').innerHTML = a ? '<section class="card" style="margin-top:12px"><div class="card-h"><span class="t">'+esc(a.q)+'</span><span class="s">as of '+longDate(todayISO())+'</span></div>'+a.run()+'</section>' : '<div class="note" style="margin-top:12px">That question is not one I can calculate. Try one of the questions above.</div>';
    $$('#ask-out [data-case]').forEach(x => x.onclick = () => { closeModal(); openDrawer(x.dataset.case) }); $$('#ask-out [data-go]').forEach(x => x.onclick = () => { closeModal(); goTo(x.dataset.go) }) };
  $('#ask-go').onclick = () => go(val('ask-in')); $('#ask-in').onkeydown = e => { if(e.key === 'Enter') go(val('ask-in')) };
  $$('[data-ask]').forEach(b => b.onclick = () => { $('#ask-in').value = ASK[+b.dataset.ask].q; go(ASK[+b.dataset.ask].q) });
}
function askList(rows){ return '<table class="mini"><tbody>'+rows.map(r => '<tr'+(r.id?' data-case="'+r.id+'" style="cursor:pointer"':'')+'><td>'+r.a+'</td><td class="r">'+r.b+'</td>'+(r.c!=null?'<td class="r dim">'+r.c+'</td>':'')+'</tr>').join('')+'</tbody></table>' }
function askBalances(){
  const os = outstandingAsOf(todayISO()), top = billables().map(c => ({c, o:owedOf(c)})).filter(x => x.o > 0).sort((a,b)=>b.o-a.o);
  let cum = 0, n50 = 0; for(const x of top){ cum += x.o; n50++; if(cum >= os.owed/2) break }
  cum = 0;
  return '<p style="margin-bottom:10px"><b>'+money(os.owed)+'</b> is outstanding across '+top.length+' fee agreements. The largest '+n50+' account for half of it.</p>' + askList(top.slice(0,10).map(x => { cum += x.o; return {id:x.c.id, a:esc(displayName(leadOf(x.c)))+' <span class="faint">'+esc(x.c.caseNo||'')+'</span>', b:money(x.o), c:(cum/os.owed*100).toFixed(0)+'% cumulative'} })) + '<div style="margin-top:10px"><button class="btn sm" data-go="reports?tab=balances">Full balance report</button></div>';
}
function askUnreceived(){
  const un = unreceivedAsOf(todayISO()), t = un.reduce((s,e)=>s+e.amt,0);
  return '<p style="margin-bottom:10px"><b>'+moneyc(t)+'</b> in '+un.length+' payouts is earned and not marked received. That counts only payouts dated on or before today, after any guarantee period.</p>' + askList(un.slice(0,10).map(e => ({id:e.c.id, a:esc(displayName(leadOf(e.c)))+' · '+(e.kind==='open'?'opening':'closing'), b:moneyc(e.amt), c:'earned '+shortDate(e.date)}))) + '<div style="margin-top:10px"><button class="btn sm" data-go="comp?tab=unreceived">Open the list</button></div>';
}
function askSources(){
  const g = {}; for(const c of billables()){ const k = c.source || 'Not recorded'; (g[k] = g[k] || []).push(c) }
  const rows = Object.entries(g).map(([k, cs]) => ({k, s:cohortOf(cs)})).filter(x => x.s.fees > 0).sort((a,b)=>b.s.rate-a.s.rate || b.s.coll-a.s.coll);
  const rec = rows.filter(x => x.k !== 'Not recorded');
  return '<p style="margin-bottom:10px">Collection rate = collected to date ÷ fees agreed, for all fee agreements from each source. '+(rec.length ? '<b>'+esc(rec[0].k)+'</b> leads at '+rec[0].s.rate+'%.' : '<b>No cases have a client source recorded yet.</b> Add it on each case (Edit details) to answer this well.')+'</p>' +
    askList(rows.map(x => ({a:esc(x.k)+' <span class="faint">· '+x.s.n+' agreements</span>', b:x.s.rate+'%', c:money(x.s.coll)+' of '+money(x.s.fees)})));
}
function askPastDue(){ const rows = billables().map(c => ({c, p:pastDueOf(c)})).filter(x => x.p.amt > 0).sort((a,b)=>b.p.oldest-a.p.oldest);
  return '<p style="margin-bottom:10px"><b>'+rows.length+'</b> clients are past due, '+money(rows.reduce((t,x)=>t+x.p.amt,0))+' in total.</p>' + askList(rows.slice(0,12).map(x => ({id:x.c.id, a:esc(displayName(leadOf(x.c))), b:money(x.p.amt), c:x.p.oldest+' days'}))) }
function askCollected(){ const t = todayISO(), mk = monthKey(t), c = collectedIn(mk+'-01', t);
  return '<p><b>'+money(c.net)+'</b> net collected '+MONTHS[+mk.slice(5)-1]+' 1 – '+shortDate(t)+': '+money(c.gross)+' in '+c.count+' payments, less '+money(c.refunds)+' refunds and '+money(c.reversals)+' reversals. Trust deposits included: '+money(c.trust)+'.</p><div style="margin-top:10px"><button class="btn sm" data-go="collections?tab=tx&from='+mk+'-01&to='+t+'">See the payments</button></div>' }
function askClosing(){ const b = bankedHalves(); return '<p style="margin-bottom:10px"><b>'+moneyc(b.reduce((t,x)=>t+x.amt,0))+'</b> in closing portions on '+b.length+' open cases. None of it is earned until each case closes.</p>' + askList(b.slice(0,10).map(x => ({id:x.c.id, a:esc(displayName(leadOf(x.c))), b:moneyc(x.amt)}))) }
function askBonus(){ const t = todayISO(), Q = quarterData(+t.slice(0,4), Math.floor((+t.slice(5,7)-1)/3));
  return '<p>Q'+(Q.q+1)+' collections are <b>'+money(Q.coll)+'</b>, at the <b>'+Q.tier+'%</b> tier. '+(Q.coll < C(Q.rule.threshold) ? money(C(Q.rule.threshold) - Q.coll)+' more is needed before any bonus.' : 'Bonus so far: <b>'+moneyc(Q.bonus)+'</b>; '+money(Q.toNext)+' more reaches '+Q.nextTier+'%.')+' This is an estimate until the quarter ends and you finalize it.</p><div style="margin-top:10px"><button class="btn sm" data-go="comp?tab=bonus">Bonus detail</button></div>' }

/* ── the slide-in prompt ── */
function promptNextPayment(){
  const el = $('#pay-prompt'); if(!el || DEMO) return;
  if(anyOvOpen()) return;
  const seen = UI.paySeen || (UI.paySeen = {});
  const g = inboxItems().find(x => !seen[x.key] && payLikelyMine(x));
  if(!g){ hidePayPrompt(); return }
  payPromptKey = g.key;
  const rec = likelyRecorded(g);
  el.innerHTML = '<div class="pp-h"><span class="led"></span>'+(g.status === 'failed' ? 'A Clio payment failed' : g.status === 'refund' ? 'Clio sent a refund' : 'A payment came in')+'<button class="x sm" id="pp-x" aria-label="Decide later">×</button></div>' + payLine(g) +
    (rec ? '<div class="pp-q">This looks <b>already recorded</b> for <b>'+esc(displayName(leadOf(rec.c)))+'</b>: '+moneyc(Math.abs(C(rec.p.amount)))+' on '+shortDate(rec.p.date)+'. Same payment?</div>' +
      '<div class="pp-acts"><button class="btn prim" id="pp-same">Yes, same payment</button><button class="btn" id="pp-yes">No, pick the client</button><button class="btn ghost" id="pp-no">Not my client</button></div>'
    : '<div class="pp-q">Is this connected to one of your clients?</div>' +
      '<div class="pp-acts"><button class="btn prim" id="pp-yes">Yes, pick the client</button><button class="btn" id="pp-no">No, discard</button></div>');
  el.classList.add('show');
  if(rec) $('#pp-same').onclick = () => { seen[g.key] = 1; saveUI(); linkExistingPay(g, rec.f, rec.p); hidePayPrompt(); paintInboxBadge(); invalidate(); refresh(); toast('Matched to the payment already recorded for <b>'+esc(displayName(leadOf(rec.c)))+'</b>. Nothing was added.'); setTimeout(promptNextPayment, 500) };
  $('#pp-yes').onclick = () => { seen[g.key] = 1; saveUI(); hidePayPrompt(); openLinkPicker(g) };
  $('#pp-no').onclick = () => { seen[g.key] = 1; saveUI(); discardPay(g) };
  $('#pp-x').onclick = () => { seen[g.key] = 1; saveUI(); hidePayPrompt(); toast('Kept in the payment inbox'); setTimeout(promptNextPayment, 400) };
}
function hidePayPrompt(){ const el = $('#pay-prompt'); if(el) el.classList.remove('show'); payPromptKey = null }

function makeDemoDB(){

  cases[5].adjustments = [{id:'da-1', date:addDays(t,-10), kind:'writeoff', amount:-800, note:"Client can't pay"}];

function showLock(mode){

    const v = inpEl.value; if(!v) return;
    err.textContent = 'Checking…';
    let ok = false;
    try{
      if(mode === 'legacy'){ ok = Store.rawGet(LS.pin) === await legacyPinHash(v); if(ok){ await Store.enable(v) } }
      else ok = await Store.unlock(v);
    }catch(e){ ok = false }

  };

  const forgot = () => askConfirm('Forgot your passcode?', 'It cannot be recovered or reset, which is what keeps the data private. You can erase this device\'s copy and bring your data back from the cloud by reconnecting sync (you will need the sync sign-in or token).<div style="margin-top:10px">Type ERASE to erase this device.'+inp('wipe-ok','','ERASE')+'</div>', () => { if(val('wipe-ok') !== 'ERASE') return false; Store.wipe(); location.reload() }, 'Erase this device', true);
  $('#lock-forgot').onclick = forgot; $('#lock-forgot').onkeydown = e => { if(e.key === 'Enter') forgot() };
}

  if(!ok){ $('#app').style.display = 'block'; $('#view').innerHTML = '<div class="card empty">This browser is blocking storage for this page. Open <b>gmannion5149.github.io/revenuetracker</b> in a normal window instead.</div>'; return }
  const pin = Store.rawGet(LS.pin);
  try{
    if(Store.encrypted()) showLock('enc');
    else if(pin && pin !== 'OFF' && pin !== 'ENC') showLock('legacy');
    else { $('#lock-screen').style.display = 'none'; $('#app').style.display = 'block'; await boot() }
  }catch(err){ console.error(err); $('#app').style.display = 'block'; $('#view').innerHTML = '<div class="card empty" style="color:var(--red)">Startup error: '+esc(err && err.message)+'. Your stored data has not been changed.</div>' }
});

</script>
