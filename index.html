/* ———— Case Revenue Tracker v7 · carbon ————
   Slate gray carbon weave, smooth slate panels, color used only where it means something:
   blue = interface accent and money owed · green = collected / paid · gold = my commission

:root{--f-words:Georgia,Gelasio,"Times New Roman",serif; --f-text:NumUser,NumLocal,NumBuiltIn,Georgia,Gelasio,"Times New Roman",serif; --f-num:NumUserAll,NumLocalAll,NumBuiltInAll,NumUser,NumLocal,NumBuiltIn,Georgia,Gelasio,serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.45;min-height:100vh;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.r,th.r,.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)} .info{color:var(--blue)} .gold{color:var(--gold)} .dim{color:var(--text-2)} .faint{color:var(--text-3)}
.b{font-weight:600} .mag{color:var(--magenta)}

/* lock */
#lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:40px 44px;width:min(380px,100%);text-align:center;box-shadow:var(--shadow)}
.lock-title{font-size:20px;font-weight:700;margin-bottom:4px}
.lock-sub{font-size:14px;color:var(--text-2);margin-bottom:22px}
.pin-row{display:flex;gap:10px;justify-content:center}
.pin-box{width:54px;height:62px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;text-align:center;font-size:26px;outline:none}
.pin-box:focus{border-color:var(--gold)}
.lock-error{min-height:18px;font-size:13px;color:var(--red);margin-top:12px}
.lock-note{font-size:13px;color:var(--text-3);margin-top:12px}
.lock-note a{color:var(--gold);cursor:pointer}
.lock-shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* shell */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand .t{font-size:16px;font-weight:700;letter-spacing:-.1px}
.brand .s{font-size:11.5px;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-left:18px}
.nav button{background:none;border:0;padding:9px 13px;border-radius:8px;color:var(--text-2);font-weight:500;cursor:pointer;white-space:nowrap;font-size:14.5px}
.nav button:hover{color:var(--text);background:var(--panel-2)}
.nav button[aria-selected=true]{color:var(--text);background:var(--panel-3);box-shadow:inset 0 -2px 0 var(--gold)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.ibtn{height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.ibtn:hover{color:var(--text);border-color:var(--line-2)}
.ibtn.prim{background:var(--gold);border-color:var(--gold);color:#1A1406}
[data-theme=light] .ibtn.prim{color:#fff}
.ibtn.prim:hover{filter:brightness(1.06);color:#1A1406}
[data-theme=light] .ibtn.prim:hover{color:#fff}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);background:none;border:0;cursor:pointer;padding:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.sync.ok i{background:var(--green)} .sync.busy i{background:var(--gold)} .sync.err i{background:var(--red)} .sync.err{color:var(--red)}
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 70px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar .sp{flex:1}
.h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.h1 small{font-size:13px;color:var(--text-3);font-weight:500;margin-left:8px}

/* period picker */
.period{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg{display:inline-flex;gap:2px}
.seg button{background:none;border:0;padding:6px 10px;border-radius:7px;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel-3);color:var(--text)}
.period .stepper{display:inline-flex;align-items:center;gap:2px}
.period .step{background:none;border:0;color:var(--text-2);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px}
.period .step:hover{background:var(--panel-2);color:var(--text)}
.period .lbl{font-weight:600;font-size:13.5px;padding:0 4px;white-space:nowrap}
.period input[type=date]{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;color-scheme:dark light}

/* cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.mb{margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h .t{font-size:14px;font-weight:600}
.card-h .s{font-size:12.5px;color:var(--text-3)}
.card-h .a{margin-left:auto;font-size:13px;color:var(--gold);background:none;border:0;cursor:pointer;font-weight:500}
.card-h .a:hover{text-decoration:underline}
.metric{position:relative;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.metric:hover{border-color:var(--line-2)}
.metric .lab{font-size:13px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px}
.metric .val{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.metric .ctx{font-size:12.5px;color:var(--text-3)}
.metric .cmp{font-size:12.5px;margin-top:8px;color:var(--text-2)}
.metric .bar-acc{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
.how{margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--text-3);width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;padding:0}
.how:hover{color:var(--text);border-color:var(--line-2)}
.delta{font-weight:600}
.big{font-size:28px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.mid{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text-2)} .kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.track{height:10px;border-radius:6px;background:var(--panel-3);position:relative}
.track .fill{height:100%;border-radius:6px;background:var(--gold)}
.track .fill.g{background:var(--green)} .track .fill.b{background:var(--blue)}
.track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-2);border-radius:1px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.2px;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.c-gold{background:var(--gold-bg);color:var(--gold)} .c-green{background:var(--green-bg);color:var(--green)} .c-amber{background:var(--amber-bg);color:var(--amber)} .c-red{background:var(--red-bg);color:var(--red)} .c-blue{background:var(--blue-bg);color:var(--blue)} .c-gray{background:var(--panel-3);color:var(--text-2)}
.list .li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;border-radius:6px}
.list .li:last-child{border-bottom:0}
.list .li:hover{background:var(--panel-2)}
.list .li .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .li .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.exc-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);padding:10px 4px 4px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.exc-h:hover{color:var(--text)}
.exc-h .v{margin-left:auto;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.empty{padding:28px;text-align:center;color:var(--text-3);font-size:14px;line-height:1.7}
.note{padding:11px 14px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:13.5px;color:var(--text-2);line-height:1.55}
.note.warn{background:var(--amber-bg);border-color:transparent;color:var(--text)} .note.bad{background:var(--red-bg);border-color:transparent;color:var(--text)} .note.ok{background:var(--green-bg);border-color:transparent;color:var(--text)} .note.info{background:var(--blue-bg);border-color:transparent;color:var(--text)}
.basis{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;background:var(--blue-bg);font-size:13.5px;margin-bottom:14px;line-height:1.55}
.basis b{font-weight:600}
.basis button{margin-left:auto}

/* buttons / form */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--text-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.prim{background:var(--gold);border-color:var(--gold);color:#1A1406;font-weight:600}
[data-theme=light] .btn.prim{color:#fff}
.btn.good{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:600}
.btn.bad{background:var(--red-bg);border-color:transparent;color:var(--red)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{color:var(--text);background:var(--panel-2)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.pill{height:30px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text-2);font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill:hover{color:var(--text)}
.pill[aria-pressed=true]{background:var(--gold-bg);border-color:var(--gold-2);color:var(--gold);font-weight:600}
.pill .n{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.fi,.sel{width:100%;height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-size:14px;outline:none}
textarea.fi{height:auto;padding:8px 11px;min-height:60px;resize:vertical}
.fi:focus,.sel:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--blue-bg)}
.sel{width:auto}
.fi[type=date],.fi[type=month]{color-scheme:dark light}
.search{width:300px;height:34px;border-radius:17px;padding:0 14px}
.fl{display:block;font-size:12.5px;color:var(--text-2);font-weight:500;margin-bottom:5px}
.frow{display:grid;gap:12px;margin-bottom:12px}
.f2{grid-template-columns:1fr 1fr} .f3{grid-template-columns:1fr 1fr 1fr} .f4{grid-template-columns:repeat(4,1fr)}
.cb{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.cb input{width:17px;height:17px;accent-color:var(--gold)}
.togs{display:flex;gap:8px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;user-select:none;font-size:14px}
.tog input{width:16px;height:16px;accent-color:var(--gold)}
.tog small{display:block;color:var(--text-3);font-size:12px}
.tog:has(input:checked){border-color:var(--gold-2);background:var(--gold-bg)}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.sec-h .a{margin-left:auto;display:flex;gap:6px;text-transform:none;letter-spacing:0}

/* tables */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 220px)}
.tbl-wrap.free{max-height:none}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;table-layout:auto}
.t th{position:sticky;top:0;z-index:2;background:var(--panel-2);text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--text)}
.t th .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize}
.t th .rz:hover,.t th .rz.on{background:var(--gold-bg)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right} .t .c{text-align:center}
.t tbody tr.row{cursor:pointer}
.t tbody tr.row:hover td{background:var(--panel-2)}
.t tbody tr.row:focus-visible{outline:none}
.t tbody tr.row:focus-visible td{background:var(--panel-3);box-shadow:inset 0 1px 0 var(--focus),inset 0 -1px 0 var(--focus)}
.t tbody tr.row.sel td{background:var(--gold-bg)}
.t tr.grp td{background:var(--panel-2);font-size:12.5px;font-weight:600;color:var(--text-2);padding:7px 12px}
.t tfoot td{position:sticky;bottom:0;background:var(--panel-2);font-weight:600;border-top:1px solid var(--line-2);border-bottom:0}
.compact .t td{padding:6px 10px} .compact .t th{padding:7px 10px} .compact .t{font-size:13.5px}
.compact .cnums{margin-top:2px}
.cname{font-weight:600}
.cnums{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:5px}
.cno{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text-2);padding:1px 7px;border-radius:5px;border:1px solid var(--line-2);background:var(--panel-2);cursor:copy;white-space:nowrap}
.cno:hover{border-color:var(--gold-2);color:var(--text)}
.cno.ic{border-style:dashed}
.cno .tg{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.4px}
.cno.copied{border-color:var(--green);color:var(--green)}
.pend{font-size:12.5px;color:var(--text-3);font-style:italic}
.chg{font-size:13px;color:var(--text-2);line-height:1.4}
.chg+.chg{margin-top:4px}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.sub-amt{display:block;font-size:12px;color:var(--text-3);font-weight:400;margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.cols-pop .cb{display:flex;padding:6px 4px}
.chk{width:17px;height:17px;accent-color:var(--green);cursor:pointer}

/* drawer */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:61;display:none;flex-direction:column;box-shadow:var(--shadow)}
.drawer.show,.drawer-scrim.show{display:flex}
.drawer-h{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.drawer-h .row1{display:flex;align-items:flex-start;gap:10px}
.drawer-h .t{font-size:19px;font-weight:700;letter-spacing:-.2px}
.drawer-h .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.drawer-b{flex:1;overflow-y:auto;padding:4px 22px 40px}
.x{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:20px;line-height:1;cursor:pointer;color:var(--text-2);flex:0 0 auto}
.x:hover{color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.tile .l{font-size:12px;color:var(--text-2)} .tile .v{font-size:18px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums} .tile .s{font-size:12px;color:var(--text-3)}
.mini{width:100%;border-collapse:collapse;font-size:13.5px}
.mini th{text-align:left;font-size:12px;color:var(--text-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.mini td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.mini .r{text-align:right;font-variant-numeric:tabular-nums}
.mini tr.void td{opacity:.5;text-decoration:line-through}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.calc .ln{display:flex;justify-content:space-between;padding:3px 0}
.calc .ln.m{color:var(--text-2)}
.calc .ln.t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hv .l{font-size:12px;color:var(--text-2)} .hv .v{font-size:18px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums} .hv .s{font-size:12.5px;color:var(--text-3)}
.hist{font-size:13px}
.hist div{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist .d{color:var(--text-3);white-space:nowrap;width:120px;flex:0 0 auto;font-variant-numeric:tabular-nums}

/* modal */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow-y:auto}
.ov.show{display:flex}
.modal{width:min(560px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:auto 0}
.modal.w{width:min(780px,96vw)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h .t{font-size:17px;font-weight:700}
.modal-h .s{font-size:12.5px;color:var(--text-3);margin-top:2px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.pop{position:fixed;z-index:90;min-width:220px;max-width:360px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer;text-align:left;font-size:14px;color:var(--text)}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--panel-2)}
.pop .mi.danger{color:var(--red)}
.pop .mi .tg{margin-left:auto;font-size:12px;color:var(--text-3)}
.pop .sep{height:1px;background:var(--line);margin:5px 4px}
.pop .hd{font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px 4px}
.pop.explain{max-width:420px;padding:14px 16px;font-size:13.5px;line-height:1.6}
.pop.explain .f{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--panel-2);border-radius:6px;padding:8px 10px;margin:8px 0;white-space:pre-wrap}
.palette{width:min(620px,96vw);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-top:6vh}
.palette input{width:100%;padding:16px 18px;font-size:16px;background:none;border:0;border-bottom:1px solid var(--line);outline:none}
.pal-list{max-height:56vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.pal-item.sel{background:var(--panel-3)}
.pal-item .h{margin-left:auto;font-size:12.5px;color:var(--text-3)}
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel-3);color:var(--text);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:10px;padding:10px 16px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast .undo{color:var(--gold);cursor:pointer;font-weight:600;background:none;border:0}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .bar-hit{cursor:pointer}
.chart .bar-hit:hover+rect,.chart g.col:hover rect.v{filter:brightness(1.15)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:130;pointer-events:none;background:var(--panel-3);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.55;display:none;box-shadow:var(--shadow)}


/* ———— carbon skin ———— */
html{background:var(--bg)}
body{font-family:var(--f-text);background:radial-gradient(1200px 600px at 50% -10%,rgba(255,255,255,.07),transparent 70%),var(--carbon),var(--bg);background-attachment:fixed;font-feature-settings:normal}
[data-theme=light] body{background:radial-gradient(1200px 600px at 50% -10%,rgba(255,255,255,.5),transparent 70%),var(--carbon),var(--bg)}
button,input,select,textarea{font-family:var(--f-text)}
.num,td.r,th.r,.money,.metric .val,.big,.mid,.tile .v,.hv .v,.pp-amt,.calc .ln span:last-child,.kv .v,.mini .r,.list .li .v,.cno,.chip .n,.badge,.seg button,.period .lbl,input.money,input[type=date]{font-family:var(--f-num)}
.h1{font-family:var(--f-words);font-size:24px;font-weight:700;letter-spacing:.1px}
.card-h .t,.drawer-h .t,.modal-h .t,.lock-title,.sec-h{font-family:var(--f-words)}
.card-h .t{font-size:15px;font-weight:700}

/* header: darker carbon plate, accent rule under the active view */
.top{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.1)),var(--carbon-hdr),#1A1E23;border-bottom:1px solid #0E1114;box-shadow:0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.35)}
[data-theme=light] .top{background:var(--carbon-hdr),#2C333B;border-bottom-color:#1A1F25}
.top .brand .t{color:#F3F5F7;font-family:var(--f-words);font-size:17px;font-weight:700;letter-spacing:.2px}
.top .brand .s{color:#A6B0BB;text-transform:none;letter-spacing:.3px;font-size:12px;font-style:italic}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;flex:0 0 30px}
.nav button{color:#C3CBD4;font-family:var(--f-words);font-size:15px;position:relative;border-radius:7px}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav button[aria-selected=true]{color:#fff;background:rgba(255,255,255,.07);box-shadow:none}
.nav button[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px rgba(90,171,255,.55)}
.top .ibtn{background:var(--metal);background:linear-gradient(180deg,#3A424B,#2A3037);border-color:#0F1215;color:#D5DCE3;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.top .ibtn:hover{color:#fff;border-color:#5A6470}
.top .ibtn.prim{background:linear-gradient(180deg,#6DB6FF,#3E8FE6);border-color:#1E5E9E;color:#08131F;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.top .sync{color:#A6B0BB}
.sync i{box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.sync.ok i{box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 8px var(--green)} .sync.busy i{background:var(--accent);box-shadow:0 0 8px var(--accent)} .sync.err i{box-shadow:0 0 8px var(--red)}
.inbox-btn{position:relative}
.inbox-btn .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#FF7272;color:#1A0A0A;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #1A1E23,0 0 10px rgba(255,114,114,.6)}
.inbox-btn .badge[hidden]{display:none}
.inbox-btn.hot{color:#fff!important;border-color:#7A3A3A!important}

/* surfaces: smooth slate plates on the weave */
.card,.tbl-wrap,.tile,.hv,.calc,.period,.modal,.palette,.pop{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 40%),var(--panel);border-color:var(--line);box-shadow:var(--bevel),0 8px 22px -14px rgba(0,0,0,.6)}
[data-theme=light] .card,[data-theme=light] .tbl-wrap,[data-theme=light] .tile,[data-theme=light] .hv,[data-theme=light] .calc,[data-theme=light] .period,[data-theme=light] .modal,[data-theme=light] .palette,[data-theme=light] .pop{background:var(--panel);box-shadow:var(--bevel),0 8px 22px -16px rgba(20,25,31,.35)}
.card{border-radius:10px}
.card-h .a{color:var(--accent)}
.sec-h{text-transform:none;letter-spacing:.1px;font-size:14px;color:var(--text);font-weight:700}
.sec-h::before{content:"";width:3px;height:14px;border-radius:1px;background:var(--accent)}
.exc-h,.pop .hd{text-transform:none;letter-spacing:.1px}

/* the four figures: a colored rail, a big BoldPrice number, nothing else shouting */
.metric{--hue:var(--accent);border-radius:10px;overflow:hidden;transition:border-color .15s,transform .15s}
.metric .bar-acc{left:0;right:0;top:0;bottom:auto;width:auto;height:3px;border-radius:0;background:var(--hue)!important;box-shadow:0 0 10px color-mix(in srgb,var(--hue) 55%,transparent)}
.metric:hover{border-color:color-mix(in srgb,var(--hue) 55%,var(--line));transform:translateY(-1px)}
.metric .lab{font-family:var(--f-words);color:var(--text-2);font-size:13.5px}
.metric .lab::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hue);box-shadow:0 0 6px var(--hue);flex:0 0 7px}
.metric .val{font-size:36px;font-weight:700;letter-spacing:.2px;margin:8px 0 3px;line-height:1.05}
.metric:has(.val.pos,.mid.pos){--hue:var(--green)} .metric:has(.val.gold,.mid.gold){--hue:var(--gold)} .metric:has(.val.info,.mid.info){--hue:var(--blue)}
.metric:has(.val.warn,.mid.warn){--hue:var(--amber)} .metric:has(.val.neg,.mid.neg){--hue:var(--red)} .metric:has(.val.mag){--hue:var(--magenta)}
.metric .val.pos,.metric .val.gold,.metric .val.info,.metric .val.warn,.metric .val.neg,.metric .val.mag{color:var(--text)}
.metric:not(:has(.bar-acc))::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--hue)}
.metric[aria-pressed=true]{border-color:var(--hue);box-shadow:0 0 0 1px var(--hue)}
.how{border-color:var(--line-2)}
.how:hover{color:var(--text);border-color:var(--accent)}
.mag{color:var(--magenta)}

/* controls: brushed metal */
.btn,.pill,.seg button[aria-pressed=true]{background:var(--metal);border-color:var(--line-2);box-shadow:var(--bevel)}
.btn:hover,.pill:hover{background:var(--metal-hi);border-color:var(--text-3)}
.btn.ghost{background:none;box-shadow:none}
.btn.prim,.ibtn.prim{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent-2));border-color:color-mix(in srgb,var(--accent-2) 70%,#000);color:var(--on-accent);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn.prim:hover,.ibtn.prim:hover{filter:brightness(1.06);color:var(--on-accent)}
[data-theme=light] .btn.prim,[data-theme=light] .ibtn.prim{color:var(--on-accent)}
.btn.good{background:linear-gradient(180deg,color-mix(in srgb,var(--green) 22%,var(--panel-2)),color-mix(in srgb,var(--green) 12%,var(--panel)));border-color:color-mix(in srgb,var(--green) 45%,var(--line-2));color:var(--green)}
.btn.bad{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 40%,transparent);color:var(--red)}
.pill[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.seg button[aria-pressed=true]{color:var(--text)}
.period .step:hover{background:var(--accent-bg);color:var(--accent)}
.fi,.sel{background:#181C21;border-color:var(--line-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
[data-theme=light] .fi,[data-theme=light] .sel{background:#FFFFFF;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.fi:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.cb input,.tog input{accent-color:var(--accent)}
.tog:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.pin-box:focus{border-color:var(--accent)}
.lock-note a,.toast .undo{color:var(--accent)}

/* chips, progress */
.chip{border-color:color-mix(in srgb,currentColor 30%,transparent)}
.track{background:#15191D;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
[data-theme=light] .track{background:var(--panel-3)}
.track .fill{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 85%,#fff),var(--gold-2))}
.track .fill.g{background:linear-gradient(180deg,color-mix(in srgb,var(--green) 85%,#fff),var(--green))}
.track .fill.b{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent-2))}

/* ledger */
.t th{background:linear-gradient(180deg,var(--panel-3),var(--panel-2));color:var(--text-2);font-family:var(--f-words);font-size:12.5px;border-bottom:1px solid var(--line-2)}
.t tbody tr.row:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--panel-2))}
.t tbody tr.row:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.t tbody tr.row.sel td{background:var(--accent-bg)}
.t th .rz:hover,.t th .rz.on{background:var(--accent-bg)}
.cno{background:#181C21;border-color:var(--line-2)}
[data-theme=light] .cno{background:#fff}
.cno:hover{border-color:var(--accent);color:var(--text)}
.cno .tg{color:var(--accent)}
.cname{font-family:var(--f-words)}

/* panel, dialogs */
.drawer{background:var(--carbon),var(--bg)}
.drawer-h{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);box-shadow:0 1px 0 var(--line)}
.tiles.t6{grid-template-columns:repeat(3,1fr)}
.tile .v{font-size:22px}
.tile .v.acc{color:var(--accent)}
.modal-h{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.pop .mi:hover,.pop .mi:focus-visible,.pal-item.sel{background:var(--accent-bg)}
.lock-card{background:var(--panel);border-color:var(--line-2);box-shadow:var(--shadow),var(--bevel)}
.lock-title{font-size:22px}

/* payment inbox */
.inbox-strip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;padding:11px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(90deg,var(--accent-bg),transparent 70%),var(--panel);color:var(--text);font-size:14.5px;box-shadow:var(--bevel)}
.inbox-strip:hover{border-color:var(--accent)}
.inbox-strip .go{margin-left:auto;color:var(--accent);font-weight:700}
.led{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg),0 0 10px var(--accent);flex:0 0 9px;animation:led 1.6s ease-in-out infinite}
@keyframes led{50%{opacity:.45}}
.pay-prompt{position:fixed;right:20px;bottom:20px;z-index:110;width:min(380px,calc(100vw - 24px));background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--panel);border:1px solid var(--line-2);border-top:3px solid var(--accent);border-radius:12px;padding:14px 16px 16px;box-shadow:var(--shadow),var(--bevel);transform:translateY(calc(100% + 30px));opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;pointer-events:none}
.pay-prompt.show{transform:none;opacity:1;pointer-events:auto}
.pp-h{display:flex;align-items:center;gap:8px;font-family:var(--f-words);font-weight:700;font-size:14.5px;margin-bottom:8px}
.pp-h .x{margin-left:auto;width:28px;height:28px;font-size:17px}
.pp-amt{font-size:32px;font-weight:700;line-height:1.1;color:var(--green)}
.pp-amt.neg{color:var(--red)}
.pp-who{font-size:16px;font-weight:700;margin-top:2px}
.pp-meta{font-size:13px;color:var(--text-2);margin-top:2px}
.pp-desc{font-size:13px;color:var(--text-3);font-style:italic;margin-top:4px}
.pp-q{margin:12px 0 10px;font-size:14px}
.pp-acts{display:flex;gap:8px;flex-wrap:wrap}
.pay-card{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}
.picks{display:flex;flex-direction:column;gap:6px}
.picks.scroll{max-height:300px;overflow-y:auto;padding-right:2px}
.pick{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;color:var(--text)}
.pick:hover,.pick:focus-visible{border-color:var(--accent);background:var(--accent-bg)}
.pk-n{font-weight:700} .pk-c{color:var(--text-3);font-size:13px} .pk-v{margin-left:auto;color:var(--text-2);font-size:13px;white-space:nowrap}
.ib-list{display:flex;flex-direction:column;gap:10px}
.ib-item{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)}

<script>
/* ── core/util.js ── */
'use strict';
/* ═════════════════ CORE UTILITIES ═════════════════
   Money:  stored as dollars (legacy format, shared with older devices through sync),
           calculated in integer cents. C() converts in, money() formats out.
   Dates:  date-only values stay 'YYYY-MM-DD' strings end to end — never Date
           objects round-tripped through UTC. "Today" is the calendar date in
           America/Chicago regardless of the device clock's zone. */

const APP_VERSION = 7.0;
const TZ = 'America/Chicago';
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MO3 = MONTHS.map(m => m.slice(0,3));

/** dollars (number|string) → integer cents */
function C(x){ const n = typeof x === 'string' ? parseFloat(x.replace(/[$,\s]/g,'')) : +x; return isFinite(n) ? Math.round(n * 100) : 0 }
/** integer cents → dollars rounded to the cent (for storage) */
function D(c){ return Math.round(c) / 100 }
/** cents → "$1,234" (whole) */
function money(c){ if(c == null || isNaN(c)) return '—'; const neg = c < 0; return (neg?'−':'') + '$' + Math.round(Math.abs(c)/100).toLocaleString('en-US') }
/** cents → "$1,234.56" */
function moneyc(c){ if(c == null || isNaN(c)) return '—'; const neg = c < 0; return (neg?'−':'') + '$' + (Math.abs(Math.round(c))/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) }
/** cents → "$162.5k" */
function moneyk(c){ const n = Math.abs(c)/100, s = c < 0 ? '−' : ''; return n >= 1e6 ? s+'$'+(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M' : n >= 1e4 ? s+'$'+String(Math.round(n/100)/10).replace(/\.0$/,'')+'k' : money(c) }
/** percent of cents → cents, rounded half away from zero */
function pctOf(c, pct){ const v = c * pct / 100; return v < 0 ? -Math.round(-v) : Math.round(v) }
/** valid money input? returns cents or null */
function parseMoney(s){ const t = String(s == null ? '' : s).replace(/[$,\s]/g,''); if(!/^-?\d+(\.\d{0,2})?$|^-?\.\d{1,2}$/.test(t)) return null; return C(t) }

const pad2 = n => String(n).padStart(2,'0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let __fixedToday = null; /* tests pin the calendar */
function todayISO(){
  if(__fixedToday) return __fixedToday;
  try{ return new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()) }
  catch(e){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()) }
}
function nowISO(){ return new Date().toISOString() }
function isISODate(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))) return false; const [y,m,d] = s.split('-').map(Number); return m >= 1 && m <= 12 && d >= 1 && d <= daysInMonth(y, m-1) }
function ymd(iso){ const [y,m,d] = String(iso).slice(0,10).split('-').map(Number); return {y, m, d} }
/* day counting on the proleptic calendar with no timezone: days since 1970-01-01 */
function dayNum(iso){ const {y,m,d} = ymd(iso); return Math.floor(Date.UTC(y, m-1, d) / 864e5) }
function fromDayNum(n){ const t = new Date(n * 864e5); return t.getUTCFullYear()+'-'+pad2(t.getUTCMonth()+1)+'-'+pad2(t.getUTCDate()) }
function addDays(iso, n){ return fromDayNum(dayNum(iso) + n) }
function daysBetween(a, b){ return dayNum(b) - dayNum(a) }
function daysInMonth(y, m0){ return new Date(Date.UTC(y, m0+1, 0)).getUTCDate() }
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0 }
function yearDays(y){ return isLeap(y) ? 366 : 365 }
function dayOfYear(iso){ const {y} = ymd(iso); return daysBetween(y+'-01-01', iso) + 1 }
/** month arithmetic that keeps the intended day: Jan 31 → Feb 28/29 → Mar 31 */
function addMonthsAnchored(iso, n, anchorDay){
  const {y, m, d} = ymd(iso), t = (m-1) + n;
  const ny = y + Math.floor(t/12), nm = ((t % 12) + 12) % 12;
  return ny+'-'+pad2(nm+1)+'-'+pad2(Math.min(anchorDay || d, daysInMonth(ny, nm)));
}
function mkOf(y, m0){ return y+'-'+pad2(m0+1) }
function monthKey(iso){ return iso ? String(iso).slice(0,7) : '' }
function monthEnd(mk){ const [y,m] = mk.split('-').map(Number); return mk+'-'+pad2(daysInMonth(y, m-1)) }
function usDate(iso){ if(!iso) return ''; const {y,m,d} = ymd(iso); return pad2(m)+'/'+pad2(d)+'/'+y }
function shortDate(iso){ if(!iso) return ''; const {y,m,d} = ymd(iso); return MO3[m-1]+' '+d+(String(y) !== todayISO().slice(0,4) ? ', '+y : '') }
function longDate(iso){ if(!iso) return ''; const {y,m,d} = ymd(iso); return MO3[m-1]+' '+d+', '+y }
function uuid(){ try{ if(crypto && crypto.randomUUID) return crypto.randomUUID() }catch(e){} return 'x'+Math.random().toString(36).slice(2)+Date.now().toString(36) }
function hashStr(s){ let h = 2166136261 >>> 0; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0 } return h.toString(36) }
function displayName(c){ if(!c) return ''; if(c.name) return c.name; const l = [c.last, [c.first,c.mid].filter(Boolean).join(' ')].filter(Boolean); return l.join(', ') || '(no name)' }
function chargeText(c){ return c.charge === 'Other' ? (c.chargeOther || 'Other') : (c.charge || '') }
function levelText(c){ return [c.level, c.degree].filter(Boolean).join(' · ') }
function isIC(c){ return c.matter === 'ic' || /-CV-/i.test(c.caseNo || '') }
function autoCaption(c){ const f = [c.first,c.mid,c.last].filter(Boolean).join(' '); return f ? (c.matter === 'ic' ? f+' v. Commissioner of Public Safety' : 'State of Minnesota v. '+f) : '' }
function normNo(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'') }
function normName(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim() }
function csvEsc(x){ x = x == null ? '' : String(x); return /[",\n\r]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x }
function toCSV(rows){ return rows.map(r => r.map(csvEsc).join(',')).join('\r\n') }
/** RFC-4180 CSV → array of rows */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  const s = String(text).replace(/^﻿/, '');
  for(let i = 0; i < s.length; i++){
    const ch = s[i];
    if(q){ if(ch === '"'){ if(s[i+1] === '"'){ f += '"'; i++ } else q = false } else f += ch; continue }
    if(ch === '"') q = true;
    else if(ch === ','){ row.push(f); f = '' }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && s[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = '' }
    else f += ch;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row) }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
/** flexible date input → ISO or null (accepts 2026-10-01, 10/1/2026, 10/1/26) */
function parseDateLoose(s){
  s = String(s||'').trim(); if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return isISODate(s.slice(0,10)) ? s.slice(0,10) : null;
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; const iso = y+'-'+pad2(+m[1])+'-'+pad2(+m[2]); return isISODate(iso) ? iso : null }
  return null;
}

/* ── core/securestore.js ── */
'use strict';
/* ═════════════════ DEVICE STORAGE (optionally encrypted at rest) ═════════════════
   With a passcode set, every tracker record this browser holds — the database,
   the sync settings (which contain the cloud token), backups and snapshots —
   is AES-GCM encrypted with a key derived from the passcode (PBKDF2-SHA256).
   The key lives only in memory. Forgetting the passcode means erasing this
   device's copy and pulling again from the cloud; it never unlocks the data.
   Without a passcode, values are stored as before (plain JSON). */
const LS = { data:'crt2_data_v1', sync:'crt2_sync', autobak:'crt2_autobak', conflict:'crt2_conflict_backup', pre7:'crt2_premigrate_v7', ui:'crt2_ui', pin:'crt2_pin', meta:'crt2_enc_meta', probe:'crt2_probe' };
const SECURE_KEYS = ['data','sync','autobak','conflict','pre7'];
const ENC_PREFIX = 'ENC1:';
const Store = {
  /** @type {CryptoKey|null} */ key: null,
  encrypted(){ try{ return !!localStorage.getItem(LS.meta) }catch(e){ return false } },
  rawGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  rawSet(k, v){ localStorage.setItem(k, v) },
  rawDel(k){ try{ localStorage.removeItem(k) }catch(e){} },
  async get(name){
    const v = this.rawGet(LS[name]); if(v == null) return null;
    if(!v.startsWith(ENC_PREFIX)) return v;
    if(!this.key) throw new Error('locked');
    return await decryptStr(this.key, v.slice(ENC_PREFIX.length));
  },
  async set(name, str){
    if(this.encrypted()){
      if(!this.key) throw new Error('locked');
      this.rawSet(LS[name], ENC_PREFIX + await encryptStr(this.key, str));
    } else this.rawSet(LS[name], str);
  },
  del(name){ this.rawDel(LS[name]) },
  async unlock(pass){
    const meta = JSON.parse(this.rawGet(LS.meta) || 'null'); if(!meta) return false;
    const key = await deriveKey(pass, meta.salt, meta.iter);
    try{ const v = await decryptStr(key, meta.verifier); if(v !== 'crt2-ok') return false }catch(e){ return false }
    this.key = key; return true;
  },
  /** encrypt everything currently stored in the clear */
  async enable(pass){
    const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 310000;
    const key = await deriveKey(pass, salt, iter);
    const plain = {}; for(const n of SECURE_KEYS){ const v = this.rawGet(LS[n]); if(v != null) plain[n] = v.startsWith(ENC_PREFIX) ? await this.get(n) : v }
    const verifier = await encryptStr(key, 'crt2-ok');
    const cipher = {}; for(const n in plain) cipher[n] = ENC_PREFIX + await encryptStr(key, plain[n]);
    for(const n in cipher) this.rawSet(LS[n], cipher[n]);
    this.rawSet(LS.meta, JSON.stringify({v:1, salt, iter, verifier, at:nowISO()}));
    this.rawSet(LS.pin, 'ENC');
    this.key = key;
  },
  async change(pass){ const plain = {}; for(const n of SECURE_KEYS){ const v = await this.get(n); if(v != null) plain[n] = v } this.rawDel(LS.meta); for(const n in plain) this.rawSet(LS[n], plain[n]); this.key = null; await this.enable(pass) },
  async disable(){ for(const n of SECURE_KEYS){ const v = await this.get(n); if(v != null) this.rawSet(LS[n], v) } this.rawDel(LS.meta); this.rawSet(LS.pin, 'OFF'); this.key = null },
  wipe(){ try{ for(const k of Object.keys(localStorage)) if(/^crt2/.test(k)) localStorage.removeItem(k) }catch(e){} try{ sessionStorage.clear() }catch(e){} }
};
function b64(u8){ let s = ''; for(const b of u8) s += String.fromCharCode(b); return btoa(s) }
function unb64(s){ const bin = atob(s), u8 = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8 }
async function deriveKey(pass, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pass)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptStr(key, str){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(str)));
  return JSON.stringify({iv:b64(iv), ct:b64(ct)});
}
async function decryptStr(key, blob){
  const o = typeof blob === 'string' ? JSON.parse(blob) : blob;
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct));
  return new TextDecoder().decode(pt);
}
/* the 4-digit PIN hash used by versions up to 6 */
async function legacyPinHash(v){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('crt2·'+v));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* ── core/engine.js ── */
'use strict';
/* ═════════════════ LEDGER ENGINE (all amounts in integer cents) ═════════════════
   Money movements are signed, dated events:
     payment, cleared ............................ +amount on its date
     payment later reversed or charged back ....... +amount on its date, −amount on the reversal date
     refund, cleared .............................. −amount on its date
     pending / failed ............................. no movement (pending listed separately)
   Fee owed  = agreed fee + adjustments dated on/before the as-of date
               (amendments ±, discounts, credits, write-offs, refund reductions).
   Balance   = fee owed − net paid. Negative = client credit; it is kept, never zeroed.
   Shared-fee companion files (criminal + implied consent on one retainer) carry no
   fee of their own; their payments count toward the lead agreement once. */
const _C = {};
function invalidate(){ for(const k in _C) delete _C[k] }
function memo(key, fn){ return key in _C ? _C[key] : (_C[key] = fn()) }

function caseById(id){ return memo('byId', () => { const m = {}; for(const c of DB.cases) m[c.id] = c; return m })[id] }

function agreementOf(c){ if(c && c.sub && c.sharedFee){ const p = caseById(c.parentId); if(p) return agreementOf(p) } return c }

const LIVE_PAY = new Set(['cleared','reversed','chargeback']);

function txEvents(c){
  return memo('tx'+c.id, () => {
    const files = [c, ...DB.cases.filter(x => x !== c && x.sub && x.sharedFee && agreementOf(x) === c)];
    const ev = [];
    for(const f of files){
      if(+f.legacyCollected && f.dateOpened) ev.push({date:f.dateOpened, amt:C(f.legacyCollected), kind:'legacy', c, file:f, account:'operating'});
      for(const p of (f.payments||[])){
        const amt = Math.abs(C(p.amount)); if(!amt || !p.date) continue;
        const st = p.status || 'cleared', acct = p.account || 'operating';
        if(payType(p) === 'refund'){ if(st === 'cleared') ev.push({date:p.date, amt:-amt, kind:'refund', p, c, file:f, account:acct}); continue }
        if(!LIVE_PAY.has(st)) continue;
        ev.push({date:p.date, amt, kind:'payment', p, c, file:f, account:acct});
        if(st !== 'cleared') ev.push({date:p.statusDate || p.date, amt:-amt, kind:st, p, c, file:f, account:acct});

function creditOf(c, d){ return Math.max(0, -balanceAsOf(c, d)) }

function paymentCount(c){ return clearedPays(c).length }

function allTransactions(){

    const out = [];
    for(const f of DB.cases) for(const p of (f.payments||[])) out.push({p, file:f, c:agreementOf(f), type:payType(p), amt:Math.abs(C(p.amount)), status:p.status||'cleared'});

/* ── installment plans ── */
function planDue(p, i){

  if(f === 'Weekly') return addDays(p.start, 7*i);
  if(f === 'Bi-weekly') return addDays(p.start, 14*i);

function planSchedule(c){

    const out = []; let sum = 0;
    for(let i = 0; sum < total && i < 520; i++){ const amt = Math.min(inst, total - sum); out.push({i, due:planDue(p, i), amount:amt}); sum += amt }

/** cleared payments fill installments oldest-first. Refunds never advance a plan;

    const sched = planSchedule(c).map(x => ({...x, paid:0, by:[]}));
    if(!sched.length) return {sched, paidTotal:0, extra:0};
    const since = c.plan.since || c.plan.start;
    const pays = [];
    for(const f of [c, ...childrenOf(c.id).filter(x=>x.sharedFee)]) for(const x of (f.payments||[])){
      if(payType(x) !== 'payment' || !x.date || x.date < since || x.date > d) continue;
      const st = x.status || 'cleared';
      if(!LIVE_PAY.has(st)) continue;
      if(st !== 'cleared' && (x.statusDate || x.date) <= d) continue;
      pays.push(x);
    }
    pays.sort((a,b)=>a.date.localeCompare(b.date) || String(a.id).localeCompare(String(b.id)));
    let k = 0, paidTotal = 0;
    for(const x of pays){

      while(left > 0 && k < sched.length){
        const s = sched[k], take = Math.min(s.amount - s.paid, left);
        s.paid += take; s.by.push({id:x.id, date:x.date, amt:take}); left -= take;

    const expComm = (st.items||[]).reduce((t,i)=>t+C(i.amt),0), expBonus = (st.bonusItems||[]).reduce((t,i)=>t+C(i.amt),0);
    const repComm = C(st.commission), repBonus = C(st.bonus);
    return {st, expComm, expBonus, repComm, repBonus, diff:(repComm + repBonus) - (expComm + expBonus)};

/* ── core/merge.js ── */
'use strict';
/* ═════════════════ MERGE (sync between devices) ═════════════════
   • Cases: the newer edit wins for case-level fields. If both copies were edited since this
     device last synced and they disagree, the other version is kept as a conflict to review.
   • Transactions, adjustments, notes and history merge item by item, so a payment entered on
     one device and a refund on another both survive.
   • Deletions are tombstoned (cases in `deleted`, transactions in `deletedTx`), so an older
     copy can never bring a deleted payment back.
   • Corrections carry their own `upd` stamp; the later correction wins.
   • Settings merge key by key using per-key edit stamps. */
const ARRAY_FIELDS = ['payments','adjustments','history','notes'];
const SKIP_COMPARE = new Set(['payments','adjustments','history','notes','updatedAt','clioSyncedAt','fv']);
function itemKey(field, x){ return field === 'history' ? (x.t||'')+'|'+(x.msg||'') : field === 'notes' ? (x.date||'')+'|'+(x.text||'') : (x.id || JSON.stringify(x)) }
function itemStamp(x){ return String(x.upd || x.at || '') }
function mergeArray(field, a, b, tomb){
  const map = new Map();
  for(const x of (a||[])) map.set(itemKey(field, x), x);
  for(const x of (b||[])){ const k = itemKey(field, x), cur = map.get(k); if(!cur || itemStamp(x) > itemStamp(cur)) map.set(k, x) }
  let out = [...map.values()];
  if(tomb && (field === 'payments' || field === 'adjustments')) out = out.filter(x => !(x.id && tomb[x.id]));
  if(field === 'history'){ out.sort((x,y)=>String(y.t).localeCompare(String(x.t))); out = out.slice(0,200) }
  if(field === 'notes') out.sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  return out;
}
function scalarDiff(a, b){
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]), out = [];
  for(const k of keys){ if(SKIP_COMPARE.has(k) || k.startsWith('clio')) continue; if(JSON.stringify(a[k] ?? null) !== JSON.stringify(b[k] ?? null)) out.push(k) }
  return out;
}
function mergeSettings(ls, rs, locNewer){
  if(!rs) return ls; if(!ls) return rs;
  const out = {}, lu = ls._upd || {}, ru = rs._upd || {};
  for(const k of new Set([...Object.keys(ls), ...Object.keys(rs)])){
    if(k === '_upd') continue;
    if(!(k in rs)){ out[k] = ls[k]; continue } if(!(k in ls)){ out[k] = rs[k]; continue }
    const l = lu[k] || '', r = ru[k] || '';
    out[k] = l || r ? (l >= r ? ls[k] : rs[k]) : (locNewer ? ls[k] : rs[k]);
  }
  out._upd = {}; for(const k of new Set([...Object.keys(lu), ...Object.keys(ru)])) out._upd[k] = (lu[k]||'') > (ru[k]||'') ? lu[k] : ru[k];
  return out;
}
/** @returns merged database (does not touch the inputs) */
function smartMerge(loc, rem, base){
  const L = JSON.parse(JSON.stringify(loc)), R = JSON.parse(JSON.stringify(rem));
  const tombC = {...(R.deleted||{})}; for(const k in (L.deleted||{})) if((L.deleted[k]||'') > (tombC[k]||'')) tombC[k] = L.deleted[k];
  const tombT = {...(R.deletedTx||{})}; for(const k in (L.deletedTx||{})) if((L.deletedTx[k]||'') > (tombT[k]||'')) tombT[k] = L.deletedTx[k];
  const conflicts = (L.conflicts||[]).concat((R.conflicts||[]).filter(x => !(L.conflicts||[]).some(y => y.id === x.id)));
  const byId = new Map(); for(const c of L.cases) byId.set(c.id, c);
  const out = [];
  const seen = new Set();
  for(const lc of L.cases){
    seen.add(lc.id);
    const rc = (R.cases||[]).find(x => x.id === lc.id);
    if(!rc){ out.push(lc); continue }
    const lu = lc.updatedAt || '', ru = rc.updatedAt || '';
    const win = ru > lu ? rc : lc, lose = win === rc ? lc : rc;
    const m = {...win};
    for(const f of ARRAY_FIELDS) if(win[f] || lose[f]) m[f] = mergeArray(f, win[f], lose[f], tombT);
    if(base && lu > base && ru > base && lu !== ru){
      const diff = scalarDiff(win, lose);
      if(diff.length){ const other = {}; for(const k of diff) other[k] = lose[k] ?? null;
        conflicts.push({id:'cf-'+lc.id+'-'+hashStr(lu+ru), caseId:lc.id, at:nowISO(), fields:diff, kept:win === lc ? 'this device' : 'other device', other, otherAt:lose.updatedAt}) }
    }
    out.push(m);
  }
  for(const rc of (R.cases||[])) if(!seen.has(rc.id)){ if(rc.payments) rc.payments = rc.payments.filter(p => !tombT[p.id]); out.push(rc) }
  const cases = out.filter(c => { const t = tombC[c.id]; return !(t && t >= (c.updatedAt||'')) });
  for(const c of cases){ if(c.payments) c.payments = c.payments.filter(p => !tombT[p.id]); if(c.adjustments) c.adjustments = c.adjustments.filter(a => !tombT[a.id]) }
  const locNewer = ((L.meta||{}).savedAt||'') >= ((R.meta||{}).savedAt||'');
  const res = {...(locNewer ? L : R)};
  res.cases = cases; res.deleted = tombC; res.deletedTx = tombT;
  res.settings = mergeSettings(L.settings, R.settings, locNewer);
  res.log = locNewer ? L.log : R.log;
  res.conflicts = conflicts.slice(-100);
  res.meta = {rev:Math.max((L.meta||{}).rev||0, (R.meta||{}).rev||0) + 1, savedAt:nowISO(), appVersion:Math.max((L.meta||{}).appVersion||0, (R.meta||{}).appVersion||0, APP_VERSION)};
  return res;
}
/** stamp a settings key as edited now (for key-by-key merging) */
function markS(...keys){ const s = DB.settings; s._upd = s._upd || {}; const t = nowISO(); for(const k of keys) s._upd[k] = t }
/** remove a transaction or adjustment everywhere, including from older copies */
function tombstoneTx(id){ DB.deletedTx = DB.deletedTx || {}; DB.deletedTx[id] = nowISO() }

/* ── core/sync.js ── */
'use strict';
/* ═════════════════ CLOUD SYNC ═════════════════
   Two interchangeable backends:
   • "worker" — the recommended one. A Cloudflare Worker with KV storage behind Cloudflare
     Access (see worker/README). The browser holds no credential at all; Access signs you in.
   • "gist"   — the backend every earlier version used: a private GitHub gist reached with a
     personal access token. The token lives only in this browser's tracker storage, which is
     encrypted when a passcode is set. Kept so existing devices keep working.
   Status reported: connection, last successful sync, last failure, unsynced local changes. */
const GIST_FILE = 'case-tracker-data.json', AUTOBAK_GIST_FILE = 'case-tracker-autobackup.json', PRE7_GIST_FILE = 'case-tracker-premigrate-v7.json';
/** @type {any} */ let SYNC = null;
let syncBusy = false, syncSoonTimer = null, lastKick = 0;
const SyncState = {phase:'idle', error:null, lastOk:null};
async function loadSyncCfg(){ try{ const v = await Store.get('sync'); SYNC = v ? JSON.parse(v) : null }catch(e){ SYNC = null } if(SYNC && !SYNC.kind) SYNC.kind = 'gist'; SyncState.lastOk = SYNC && SYNC.lastSyncAt || null }
function syncCfg(){ return SYNC }
function setSyncCfg(c){ SYNC = c; (c ? Store.set('sync', JSON.stringify(c)) : Promise.resolve(Store.del('sync'))).catch(()=>{}); if(typeof paintSync === 'function') paintSync() }
function pendingChanges(){ const c = SYNC; if(!c || !DB) return 0; const since = c.lastSyncAt || ''; return DB.cases.filter(x => (x.updatedAt||'') > since).length + (DB.meta.rev > (c.lastPushRev||0) ? 0 : 0) }
function hasUnpushed(){ const c = SYNC; return !!(c && DB && DB.meta && DB.meta.rev > (c.lastPushRev||0)) }

/* ── backends ── */
const Backends = {
  gist: {
    label:'GitHub gist (token in this browser)',
    async api(method, path, body, etag){
      const c = SYNC; if(!c || !c.token) throw new Error('No GitHub token on this device');
      const r = await fetch('https://api.github.com'+path, {method, headers:{'Authorization':'Bearer '+c.token, 'Accept':'application/vnd.github+json', ...(etag?{'If-None-Match':etag}:{}), ...(body?{'Content-Type':'application/json'}:{})}, body:body?JSON.stringify(body):undefined});
      if(r.status === 304) return {notModified:true};
      if(!r.ok) throw new Error('GitHub '+r.status+(r.status===401?' (token invalid or expired)':r.status===404?' (gist not found)':''));
      const j = await r.json(); j.__etag = r.headers.get('etag'); return j;
    },
    async content(f){ if(!f) return null; if(f.truncated){ const rr = await fetch(f.raw_url); return await rr.text() } return f.content },
    async find(){ const list = await this.api('GET', '/gists?per_page=100'); const hits = (list||[]).filter(g => g.files && g.files[GIST_FILE]); hits.sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at))); return hits[0] ? hits[0].id : null },
    async pull(force){ const c = SYNC; if(!c.gistId){ c.gistId = await this.find(); if(!c.gistId) return null }
      const g = await this.api('GET', '/gists/'+c.gistId, null, force ? null : c.etag); if(g.notModified) return {notModified:true};
      c.etag = g.__etag; const txt = await this.content(g.files && g.files[GIST_FILE]); return txt ? JSON.parse(txt) : null },
    async push(db){ const c = SYNC, payload = {description:'Case Revenue Tracker — auto-sync (private)', files:{[GIST_FILE]:{content:JSON.stringify(db)}}};
      const res = c.gistId ? await this.api('PATCH', '/gists/'+c.gistId, payload) : await this.api('POST', '/gists', {...payload, public:false});
      c.gistId = res.id || c.gistId; c.etag = res.__etag || c.etag },
    async putFile(name, content){ const c = SYNC; if(!c || !c.gistId) return false; await this.api('PATCH', '/gists/'+c.gistId, {files:{[name]:{content}}}); return true }
  },
  worker: {
    label:'Firm sync worker (Cloudflare Access sign-in)',
    async req(method, path, body, headers){
      const c = SYNC; const r = await fetch(c.url.replace(/\/+$/,'')+path, {method, credentials:'include', headers:{'Accept':'application/json', ...(body?{'Content-Type':'application/json'}:{}), ...(headers||{})}, body:body?JSON.stringify(body):undefined});
      if(r.status === 401 || r.status === 403) throw new Error('Sign-in required. Open '+c.url+' in this browser once to sign in through Cloudflare Access.');
      return r;
    },
    async pull(){ const r = await this.req('GET', '/v1/data'); if(r.status === 404) return null; if(!r.ok) throw new Error('Sync worker '+r.status); SYNC.etag = r.headers.get('etag'); const j = await r.json(); return j && j.data ? j.data : j },
    async push(db){ const r = await this.req('PUT', '/v1/data', {data:db}, SYNC.etag ? {'If-Match':SYNC.etag} : {});
      if(r.status === 412) throw Object.assign(new Error('changed elsewhere'), {retry:true});
      if(!r.ok) throw new Error('Sync worker '+r.status); SYNC.etag = r.headers.get('etag') },
    async putFile(name, content){ const r = await this.req('PUT', '/v1/file/'+encodeURIComponent(name), {content}); return r.ok }
  }
};
function backend(){ return SYNC ? Backends[SYNC.kind || 'gist'] : null }

async function syncNow(manual){
  if(DEMO) return;
  const c = SYNC; if(!c){ if(manual && typeof openSettings === 'function') openSettings('sync'); return }
  if(syncBusy) return; syncBusy = true;
  await flushSave();
  SyncState.phase = 'busy'; paintSync();
  try{
    for(let attempt = 0; attempt < 3; attempt++){
      const remote = await backend().pull(attempt > 0);
      if(remote && !remote.notModified && remote.cases && remote.meta){
        if((remote.meta.appVersion||0) > APP_VERSION) notifyUpdate();
        if(!DB.cases.length && !(DB.meta.rev > 0)){ DB = remote; normalizeDB(); await migrateDB(); settleAfterLoad() }
        else {
          const before = JSON.stringify({c:DB.cases, s:DB.settings, d:DB.deletedTx});
          try{ await Store.set('conflict', JSON.stringify(DB)) }catch(e){ Store.del('conflict') }
          DB = smartMerge(DB, remote, c.lastSyncAt || null); normalizeDB(); await migrateDB(); settleAfterLoad();
          if(before !== JSON.stringify({c:DB.cases, s:DB.settings, d:DB.deletedTx})){ invalidate(); if(typeof refresh === 'function') refresh(); }
        }
        await writeDB();
      }
      if(!c.lastPushRev || DB.meta.rev > c.lastPushRev || !remote){
        try{ await backend().push(DB) }catch(e){ if(e.retry) continue; throw e }
        c.lastPushRev = DB.meta.rev;
      }
      break;
    }
    c.lastSyncAt = nowISO(); delete c.lastError; SyncState.error = null; SyncState.lastOk = c.lastSyncAt;
    setSyncCfg(c); await pushPre7();
    if(manual) toast('Sync complete');
  }catch(e){
    c.lastError = e.message; c.lastErrorAt = nowISO(); SyncState.error = e.message; setSyncCfg(c);
    if(manual) toast('Sync failed: '+esc(e.message), null, 9000);
  }finally{ syncBusy = false; SyncState.phase = 'idle'; paintSync() }
}
function scheduleSync(){ if(!SYNC || DEMO) return; clearTimeout(syncSoonTimer); syncSoonTimer = setTimeout(()=>syncNow(false), 4000) }
function kickSync(){ if(!SYNC) return; const t = Date.now(); if(t - lastKick < 15000) return; lastKick = t; syncNow(false) }
let __updNote = 0;
function notifyUpdate(){ const t = Date.now(); if(t - __updNote < 6*3600e3) return; __updNote = t; toast('A newer version of the tracker is deployed. Reload this page to use it.', null, 9000) }
async function connectSync(cfg){
  setSyncCfg(cfg); SyncState.phase = 'busy'; paintSync();
  try{ if(cfg.kind === 'gist' && !cfg.gistId) cfg.gistId = await Backends.gist.find(); await syncNow(false); if(SYNC.lastError) throw new Error(SYNC.lastError); toast('Cloud sync is on'); return true }
  catch(e){ toast('Could not connect: '+esc(e.message), null, 9000); return false }
}
/* the pre-upgrade snapshot also goes to the cloud, so it survives this browser */
async function pushPre7(){
  const m = (DB.settings.migrations||{}).v7; if(!m || m.pushed || !SYNC) return;
  let snap = PRE7_PENDING; if(!snap){ try{ snap = await Store.get('pre7') }catch(e){} } if(!snap) return;
  try{ if(await backend().putFile(PRE7_GIST_FILE, snap)){ m.pushed = nowISO(); markS('migrations'); save() } }catch(e){}
}
/* ── automatic backup: one local snapshot every 3 days, mirrored to the cloud ── */
async function autoBackupNow(reason){
  if(!DB || DEMO) return null;
  const snap = {at:nowISO(), reason:reason||'auto', cases:DB.cases.length, data:JSON.stringify({app:'crt2', version:2, exported:nowISO(), data:DB})};
  try{ await Store.set('autobak', JSON.stringify([snap])) }catch(e){ Store.del('autobak') }
  DB.settings.lastAutoBackup = snap.at; markS('lastAutoBackup');
  return snap;
}
async function autoBackupTick(){
  if(!DB || DEMO) return;
  const last = DB.settings.lastAutoBackup;
  if(last && Date.now() - new Date(last).getTime() < 3*864e5) return;
  const snap = await autoBackupNow('scheduled'); save();
  if(snap && SYNC) try{ await backend().putFile(AUTOBAK_GIST_FILE, snap.data) }catch(e){}
}

/* ── core/actions.js ── */
'use strict';
/* ═════════════════ FINANCIAL ACTIONS ═════════════════
   The only functions that change money records. Each writes a dated line to the
   case's history, stamps the record for sync, and leaves deletions as tombstones. */
function addPayment(c, o, quiet){
  c.payments = c.payments || [];
  const p = {id:o.id || uuid(), date:o.date, amount:D(Math.abs(o.amt)), type:'payment', status:o.status || 'cleared', method:o.method || '', account:o.account || 'operating', source:o.source || 'manual', ref:o.ref || '', reconciled:null, note:o.note || '', at:nowISO(), upd:nowISO()};
  c.payments.push(p);
  hist(c, (p.status === 'pending' ? 'Pending payment ' : 'Payment ')+moneyc(o.amt)+' dated '+usDate(p.date)+(p.method?' · '+p.method:'')+(p.account==='trust'?' · trust':''));
  if(!quiet) save(); return p;
}
function addRefund(c, o){
  c.payments = c.payments || [];
  const p = {id:uuid(), date:o.date, amount:-D(Math.abs(o.amt)), type:'refund', status:'cleared', method:o.method || '', account:o.account || 'operating', source:'manual', ref:o.ref || '', reconciled:null, note:o.note || '', at:nowISO(), upd:nowISO()};
  c.payments.push(p);
  hist(c, 'Refund '+moneyc(o.amt)+' dated '+usDate(p.date)+(o.note?' · '+o.note:''));
  if(o.reduceFee) addAdjustment(c, {kind:'refundadj', amt:-Math.abs(o.amt), date:o.date, note:'Fee reduced with refund'+(o.note?' · '+o.note:''), link:p.id}, true);
  save(); return p;
}
function setPaymentStatus(c, p, status, date){
  const from = p.status || 'cleared'; p.status = status; p.statusDate = status === 'cleared' || status === 'pending' ? null : (date || todayISO()); p.upd = nowISO();
  hist(c, 'Payment of '+moneyc(Math.abs(C(p.amount)))+' ('+usDate(p.date)+') '+PAY_STATUS[from].toLowerCase()+' → '+PAY_STATUS[status].toLowerCase()+(p.statusDate?' on '+usDate(p.statusDate):''));
  save();
}
function editPayment(c, p, f){
  const ch = [];
  if(f.date && f.date !== p.date){ ch.push('date '+usDate(p.date)+' → '+usDate(f.date)); p.date = f.date }
  if(f.amt != null && f.amt !== Math.abs(C(p.amount))){ ch.push('amount '+moneyc(Math.abs(C(p.amount)))+' → '+moneyc(f.amt)); p.amount = D(p.type === 'refund' ? -f.amt : f.amt) }
  for(const k of ['method','account','ref','note']) if(f[k] != null && f[k] !== (p[k]||'')){ ch.push(k+' "'+(p[k]||'')+'" → "'+f[k]+'"'); p[k] = f[k] }
  if(!ch.length) return;
  p.upd = nowISO(); hist(c, 'Corrected '+(p.type === 'refund' ? 'refund' : 'payment')+': '+ch.join('; ')); save();
}
function deletePayment(c, p){
  c.payments = (c.payments||[]).filter(x => x !== p); tombstoneTx(p.id);
  const linked = (c.adjustments||[]).filter(a => a.link === p.id); for(const a of linked){ c.adjustments = c.adjustments.filter(x => x !== a); tombstoneTx(a.id) }
  hist(c, 'Deleted '+(p.type === 'refund' ? 'refund' : 'payment')+' '+moneyc(Math.abs(C(p.amount)))+' dated '+usDate(p.date)); save();
}
function setReconciled(c, p, on, tag){ p.reconciled = on ? (tag || todayISO()) : null; p.upd = nowISO(); touch(c) }
function addAdjustment(c, o, quiet){
  c.adjustments = c.adjustments || [];
  const a = {id:uuid(), date:o.date || todayISO(), kind:o.kind, amount:D(o.amt), note:o.note || '', link:o.link || null, at:nowISO(), upd:nowISO()};
  c.adjustments.push(a);
  hist(c, ADJ_KINDS[o.kind]+' '+(o.amt >= 0 ? '+' : '−')+moneyc(Math.abs(o.amt))+' dated '+usDate(a.date)+(a.note?' · '+a.note:''));
  if(!quiet) save(); return a;
}
function deleteAdjustment(c, a){ c.adjustments = c.adjustments.filter(x => x !== a); tombstoneTx(a.id); hist(c, 'Removed '+ADJ_KINDS[a.kind].toLowerCase()+' of '+moneyc(Math.abs(C(a.amount)))+' dated '+usDate(a.date)); save() }
function setPlan(c, o){
  const was = c.plan && c.plan.active ? c.plan : null;
  c.plan = {active:true, amount:D(o.amt), frequency:o.frequency, start:o.start, anchorDay:+o.start.slice(8,10), total:D(o.total), since:o.since || todayISO(), createdAt:was && was.createdAt || nowISO()};
  c.plan.nextDate = (nextInstallmentRaw(c) || o.start);
  hist(c, (was ? 'Payment plan changed: ' : 'Payment plan set: ')+moneyc(o.amt)+' '+o.frequency.toLowerCase()+' from '+usDate(o.start)+' for '+moneyc(o.total)); save();
}
function stopPlan(c, why){ if(!c.plan) return; c.plan.active = false; c.plan.endedOn = todayISO(); hist(c, 'Payment plan stopped'+(why?' ('+why+')':'')); save() }
function closeCase(c, date, quiet){
  const d = date || todayISO();
  c.resolved = true; c.status = 'closed'; c.closedDate = d;
  for(const k of childrenOf(c.id)) if(!k.resolved){ k.resolved = true; k.status = 'closed'; k.closedDate = d; touch(k) }
  hist(c, 'Case closed '+usDate(d)); invalidate();
  const m = commOf(c);
  if(!quiet){ save(); if(typeof toast === 'function') toast('Closed <b>'+esc(displayName(c))+'</b>'+(m && m.close.amt ? ' · closing ½ earned '+moneyc(m.close.amt) : '')) }
}
function reopenCase(c){ c.resolved = false; c.status = 'active'; c.closedDate = null; hist(c, 'Case reopened'); save() }
function markReceived(c, key, date, stmt, quiet){
  invalidate(); const m = commOf(c); if(!m) return;
  const h = key === 'open' ? m.open : m.close;
  c.commPaid = c.commPaid || {}; c.commPaid[key] = {on:date || todayISO(), amt:D(h.calc), stmt:stmt || null};
  hist(c, (key === 'open' ? 'Opening' : 'Closing')+' commission '+moneyc(h.calc)+' marked received '+usDate(date || todayISO())+(stmt?' (payroll statement)':''));
  if(!quiet) save();
}
function unmarkReceived(c, key){ if(c.commPaid && c.commPaid[key]){ const r = c.commPaid[key]; delete c.commPaid[key]; hist(c, (key === 'open' ? 'Opening' : 'Closing')+' commission receipt of '+usDate(r.on)+' removed'); save() } }
function setOverride(c, ov){
  const was = c.commOverride;
  if(ov){ c.commOverride = {...ov, at:nowISO()}; hist(c, 'Commission exception: '+(ov.amount != null && ov.amount !== '' ? 'fixed '+moneyc(C(ov.amount)) : ov.pct+'%')+(ov.openShare!=null&&ov.openShare!==''?' · '+ov.openShare+'% at open':'')+' · '+ov.reason+(ov.by?' · authorized by '+ov.by:'')) }
  else if(was){ delete c.commOverride; hist(c, 'Commission exception removed') }
  save();
}
function deleteCase(c){
  const files = [c, ...groupOf(c).filter(x => x !== c && x.parentId === c.id)], stamp = nowISO();
  DB.cases = DB.cases.filter(x => !files.includes(x)); for(const x of files) DB.deleted[x.id] = stamp;
  logEv('Deleted '+displayName(c)+(files.length > 1 ? ' and '+(files.length-1)+' related file(s)' : '')); save();
  return files;
}

/* ── core/clio.js ── */
'use strict';
/* ═════════════════ CLIO (read-only) ═════════════════
   Through the firm's Clio worker (gwm-clio-api), which holds the OAuth token server-side.
   Endpoints this tracker uses, confirmed against the worker and GWMNotes:
     GET /status            connection + signed-in user
     GET /matters?scope=my&status=all&limit=1000
   Nothing is ever written to Clio. The worker exposes no billing, payment or trust
   endpoints, so Clio billing data cannot be imported until read-only endpoints for
